<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Via • Росток Жизни</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; }
    .glass { background: rgba(255,255,255,0.08); backdrop-filter: blur(20px); }
    .message-bubble { border-radius: 20px 20px 20px 4px; }
    .chat-bg { background: linear-gradient(145deg, #0f172a 0%, #1e2937 100%); }
  </style>
</head>
<body class="bg-black text-white min-h-screen overflow-hidden">

  <div class="flex flex-col h-screen chat-bg">

    <!-- Header -->
    <div class="sticky top-0 z-50 glass border-b border-white/10 px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-2xl bg-gradient-to-br from-emerald-400 to-teal-500 flex items-center justify-center text-2xl shadow-lg">
          🌱
        </div>
        <div>
          <h1 class="font-semibold text-lg tracking-tight">Via • Росток Жизни</h1>
          <div class="flex items-center gap-1 text-xs text-emerald-400">
            <div class="w-2 h-2 bg-emerald-400 rounded-full animate-pulse"></div>
            <span id="online-count">Онлайн</span>
          </div>
        </div>
      </div>
      
      <button onclick="connectTON()" 
              class="flex items-center gap-2 px-5 py-2.5 bg-white/10 hover:bg-white/20 rounded-3xl text-sm font-medium transition-all active:scale-95">
        <i class="fa-solid fa-wallet"></i>
        <span id="wallet-btn">TON Connect</span>
      </button>
    </div>

    <!-- Messages -->
    <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-6 pb-28 scrollbar-thin scrollbar-thumb-white/20"></div>

    <!-- Input -->
    <div class="fixed bottom-0 left-0 right-0 glass border-t border-white/10 p-4">
      <div class="max-w-2xl mx-auto flex gap-3">
        <input 
          id="input"
          type="text" 
          placeholder="Напишите сообщение..." 
          class="flex-1 bg-white/10 border border-white/10 focus:border-emerald-500 rounded-3xl px-6 py-4 text-[17px] placeholder:text-gray-400 focus:outline-none transition-all"
          onkeypress="if(event.key === 'Enter') sendMessage()"
        />
        <button onclick="sendMessage()"
                class="w-14 h-14 bg-gradient-to-br from-emerald-500 to-teal-600 rounded-3xl flex items-center justify-center active:scale-95 transition-all shadow-xl">
          <i class="fa-solid fa-paper-plane text-xl"></i>
        </button>
      </div>
    </div>
  </div>

  <script>
    // === Supabase ===
    const supabase = createClient(
      'https://vwarulougzcsohoybxmv.supabase.co',
      'sb_publishable_McRGklsHAddHiLKspw3G9w_JIfRKnX_'
    );

    let currentUser = null;
    let messagesContainer = document.getElementById('messages');

    async function initTelegram() {
      if (window.Telegram?.WebApp) {
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        currentUser = tg.initDataUnsafe?.user;
        console.log("Telegram User:", currentUser);
      }
    }

    // Загрузка старых сообщений
    async function loadMessages() {
      const { data, error } = await supabase
        .from('messages')
        .select('*')
        .order('created_at', { ascending: true });

      if (error) console.error(error);
      else renderMessages(data || []);
    }

    function renderMessages(msgs) {
      messagesContainer.innerHTML = '';
      msgs.forEach(msg => {
        const isMe = currentUser && msg.user_id === String(currentUser.id);
        const div = document.createElement('div');
        div.className = `flex ${isMe ? 'justify-end' : 'justify-start'}`;
        div.innerHTML = `
          <div class="${isMe ? 'max-w-[75%]' : 'max-w-[80%]}">
            ${!isMe ? `<div class="text-xs text-gray-400 mb-1 px-2">${msg.username || 'Аноним'}</div>` : ''}
            <div class="glass px-5 py-3 message-bubble ${isMe ? 'bg-emerald-600/90 rounded-tr-none' : 'bg-white/10 rounded-tl-none'}">
              <p class="text-[17px] leading-tight">${msg.text}</p>
            </div>
            <div class="text-[10px] text-gray-500 mt-1 px-2">${new Date(msg.created_at).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'})}</div>
          </div>
        `;
        messagesContainer.appendChild(div);
      });
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // Отправка сообщения
    async function sendMessage() {
      const input = document.getElementById('input');
      if (!input.value.trim() || !currentUser) return;

      const { error } = await supabase.from('messages').insert({
        user_id: String(currentUser.id),
        username: currentUser.username || currentUser.first_name,
        text: input.value.trim()
      });

      if (error) alert("Ошибка отправки");
      else input.value = '';
    }

    // Realtime подписка
    function subscribeToMessages() {
      supabase
        .channel('messages-channel')
        .on('postgres_changes', 
          { event: 'INSERT', schema: 'public', table: 'messages' }, 
          (payload) => {
            loadMessages(); // простая перезагрузка для MVP
          }
        )
        .subscribe();
    }

    // TON Connect
    function connectTON() {
      alert("TON Connect\n\nВ реальном приложении здесь откроется окно подключения кошелька (Tonkeeper, Telegram Wallet)");
      document.getElementById('wallet-btn').innerHTML = '✓ Подключён';
    }

    // Инициализация
    window.onload = async () => {
      await initTelegram();
      await loadMessages();
      subscribeToMessages();
      
      // Имитация онлайн
      setInterval(() => {
        document.getElementById('online-count').textContent = Math.floor(1200 + Math.random()*800) + " онлайн";
      }, 7000);
    };
  </script>
</body>
</html>

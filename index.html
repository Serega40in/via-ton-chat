<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Via • Росток Жизни</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; }
    .glass { background: rgba(255,255,255,0.08); backdrop-filter: blur(20px); }
    .message-bubble { border-radius: 20px 20px 20px 4px; }
    .chat-bg {
      background: linear-gradient(145deg, #0f172a 0%, #1e2937 100%);
    }
    .sprout { filter: drop-shadow(0 0 8px #22c55e); }
  </style>
</head>
<body class="bg-black text-white min-h-screen overflow-hidden">

  <div class="flex flex-col h-screen chat-bg">

    <!-- Header -->
    <div class="sticky top-0 z-50 glass border-b border-white/10 px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-2xl bg-gradient-to-br from-emerald-400 to-green-600 flex items-center justify-center text-2xl sprout">
          🌱
        </div>
        <div>
          <h1 class="font-semibold text-xl tracking-tight">Via</h1>
          <p class="text-xs text-emerald-400 -mt-0.5">Росток Жизни</p>
        </div>
      </div>
      
      <button onclick="connectWallet()" 
              class="flex items-center gap-2 px-5 py-2.5 bg-white/10 hover:bg-white/20 rounded-3xl text-sm font-medium transition-all active:scale-95">
        <i class="fa-solid fa-wallet"></i>
        <span id="wallet-btn">Подключить TON</span>
      </button>
    </div>

    <!-- Messages -->
    <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-6 pb-28 scrollbar-thin scrollbar-thumb-white/20">
      <!-- JS added -->
    </div>

    <!-- Input -->
    <div class="fixed bottom-0 left-0 right-0 glass border-t border-white/10 p-4">
      <div class="max-w-2xl mx-auto flex gap-3">
        <input 
          id="input"
          type="text" 
          placeholder="Напишите сообщение..." 
          class="flex-1 bg-white/10 border border-white/10 focus:border-emerald-500/50 rounded-3xl px-6 py-4 text-[17px] placeholder:text-gray-400 focus:outline-none transition-all"
          onkeypress="if(event.key === 'Enter') sendMessage()"
        />
        <button onclick="sendMessage()"
                class="w-14 h-14 bg-gradient-to-br from-emerald-500 to-green-600 rounded-3xl flex items-center justify-center active:scale-95 transition-all shadow-xl shadow-emerald-500/30">
          <i class="fa-solid fa-paper-plane text-xl"></i>
        </button>
      </div>
      <div class="text-center text-[10px] text-gray-500 mt-3">Via — Мини-чат на TON 🌱</div>
    </div>
  </div>

  <script>
    const messagesContainer = document.getElementById('messages');
    let walletConnected = false;

    const initialMessages = [
      { user: "ton_grower", text: "Привет! Это Via — новый чат на TON 🌱", time: "14:21" },
      { user: "sprout_user", text: "Росток жизни уже прорастает! Кто со мной?", time: "14:22" }
    ];

    function renderMessages() {
      messagesContainer.innerHTML = '';
      initialMessages.forEach(msg => {
        const isMe = msg.user === "you";
        const div = document.createElement('div');
        div.className = `flex ${isMe ? 'justify-end' : 'justify-start'}`;
        div.innerHTML = `
          <div class="${isMe ? 'max-w-[75%]' : 'max-w-[80%]'}">
            ${!isMe ? `<div class="text-xs text-gray-400 mb-1 px-2">${msg.user}</div>` : ''}
            <div class="glass px-5 py-3 message-bubble ${isMe ? 'bg-emerald-600/90 rounded-tr-none' : 'bg-white/10 rounded-tl-none'}">
              <p class="text-[17px] leading-tight">${msg.text}</p>
            </div>
            <div class="text-[10px] text-gray-500 mt-1 px-2">${msg.time}</div>
          </div>
        `;
        messagesContainer.appendChild(div);
      });
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function sendMessage() {
      const input = document.getElementById('input');
      if (!input.value.trim()) return;

      initialMessages.push({
        user: "you",
        text: input.value,
        time: new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })
      });

      renderMessages();
      input.value = '';
    }

    function connectWallet() {
      walletConnected = !walletConnected;
      document.getElementById('wallet-btn').innerHTML = walletConnected ? '🌱 Connected' : 'Подключить TON';
      if (walletConnected) alert('✅ TON-кошелёк подключён! (В реальном проекте — TON Connect)');
    }

    window.onload = () => {
      renderMessages();
      setInterval(() => {
        if (Math.random() > 0.65) {
          initialMessages.push({
            user: "grower_" + Math.floor(Math.random()*999),
            text: ["🌱 Растём вместе!", "Via — будущее чатов на TON", "Кто создаёт свой Jetton?"][Math.floor(Math.random()*3)],
            time: new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })
          });
          renderMessages();
        }
      }, 7000);
    };
  </script>
</body>
</html>
